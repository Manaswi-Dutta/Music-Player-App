<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1 class="text-center">Music Player</h1>
    <div class="row">
        <div class="d-flex justify-content-end">
           <label class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
            <span class="toggle-text">Light Mode</span>
           </label>

        </div>
    </div>
    <div class="row">
        <div class="col-md-4 col-sm-12 p-4 col-bg">
            <div class="filter-col">
                <label>Filter by Genre:</label>
                <select id="genreFilter">
                    <option value="All">All</option>
                    <option value="Pop">Pop</option>
                    <option value="Synthwave">Synthwave</option>
                    <option value="Latin Pop">Latin Pop</option>
                    <option value="Alternative Rock">Alternative Rock</option>
                </select>
                <h3>All Songs</h3>
                <ul id="songsList">
                    
                </ul>
            </div>
        </div>
        <div class="col-md-4 col-sm-12 p-4  col-bg">
            <div id="song-card">
                
            </div>
            <div id="controls">
                <div class="d-flex">
                    <button id="prevBtn" class="dm-btn">Previous</button>
                    <button id="nextBtn" class="dm-btn">Next</button>
                </div>
            <button id="playListBtn" class="dm-btn">Add to Playlist</button>
            </div>
        </div>
        <div class="col-md-4 col-sm-12 col-bg">
            <div>
                <div class="d-flex">
                    <input type="text" id="createPlaylist" placeholder="Enter Playlist Name"/>
                    <button id="createBtn" class="mx-3">Create Playlist</button>
                </div>
                <div>
                    <h3 class="title-col-3">
                        Current Playlist
                    </h3>
                    <ul id="currentPlaylist">

                    </ul>
                </div>
                <div>
                    <h3 class="title-col-3">
                        All Playlists
                    </h3>
                    <ul id="allPlaylists">

                    </ul>
                </div>
            </div>
        </div>

    </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
